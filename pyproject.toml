[tool.poetry]
name = "django-task-psql"
version = "0.1.0"
description = "A Postgres-native backend for Django Tasks (django.tasks) — SKIP LOCKED claiming, LISTEN/NOTIFY wakeup, automatic retry with backoff."
authors = ["YP Software <info@ypsoftware.com.py>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ypsoftware/django-task-psql"
repository = "https://github.com/ypsoftware/django-task-psql"
keywords = ["django", "tasks", "postgres", "queue", "background-jobs"]
packages = [{ include = "django_task_psql" }]

[tool.poetry.dependencies]
python = "^3.12"
django = ">=6.0"
psycopg = { version = ">=3.1", extras = ["pool"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.9"
ruff = "^0.8"
psycopg-binary = ">=3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
