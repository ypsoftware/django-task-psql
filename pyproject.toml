[project]
name = "django-task-psql"
version = "0.2.1"
description = "A Postgres-native backend for Django Tasks (django.tasks) — SKIP LOCKED claiming, LISTEN/NOTIFY wakeup, automatic retry with backoff."
authors = [{ name = "YP Software", email = "info@ypsoftware.com.py" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["django", "tasks", "postgres", "queue", "background-jobs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
]
dependencies = [
    "django>=6.1", # 6.0 no reenvía kwargs arbitrarios en @task() (necesario para max_attempts por tarea)
    "psycopg[pool]>=3.1",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]

[project.urls]
Homepage = "https://github.com/ypsoftware/django-task-psql"
Repository = "https://github.com/ypsoftware/django-task-psql"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "psycopg-binary>=3.1",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
    "sphinx-intl>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["django_task_psql"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
