[project]
name = "django-task-psql"
version = "0.1.0"
description = "A Postgres-native backend for Django Tasks (django.tasks) — SKIP LOCKED claiming, LISTEN/NOTIFY wakeup, automatic retry with backoff."
authors = [{ name = "YP Software", email = "info@ypsoftware.com.py" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["django", "tasks", "postgres", "queue", "background-jobs"]
dependencies = [
    "django>=6.0",
    "psycopg[pool]>=3.1",
]

[project.urls]
Homepage = "https://github.com/ypsoftware/django-task-psql"
Repository = "https://github.com/ypsoftware/django-task-psql"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "psycopg-binary>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["django_task_psql"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
